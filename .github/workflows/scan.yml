name: Scan quotidien
on:
  schedule:
    - cron: "0 5 * * 1-5"   # 7 h à Paris (heure d'été), du lundi au vendredi
  workflow_dispatch:
    inputs:
      backfill:
        description: "Nombre d'articles déjà en base à faire qualifier par l'IA (0 = aucun)"
        default: "0"
      days:
        description: "Nombre de jours de presse à relire"
        default: "3"
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - run: python scanner/scan.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-haiku-5-5
          BACKFILL: ${{ inputs.backfill || '0' }}
          DAYS: ${{ inputs.days || '3' }}
